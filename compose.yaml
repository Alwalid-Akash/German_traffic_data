services:
  backend:
    build: ./backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # Public URL used by the browser, not a Docker service hostname or secret.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      - backend
